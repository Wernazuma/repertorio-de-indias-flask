<!DOCTYPE html>
<html>
<head>
    <title>Upload CSV File</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        
        .upload-container {
            border: 2px dashed #ccc;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
            background-color: #f9f9f9;
        }
        
        .upload-container.dragover {
            border-color: #007bff;
            background-color: #e3f2fd;
        }
        
        input[type="file"] {
            margin: 20px 0;
            padding: 10px;
        }
        
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        
        button:hover {
            background-color: #0056b3;
        }
        
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        
        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
        }
        
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .loading {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <h1>Upload CSV File</h1>
    
    <div class="upload-container" id="uploadContainer">
        <form id="uploadForm" enctype="multipart/form-data">
            <p>Select a CSV file to upload:</p>
            <input type="file" name="file" id="fileInput" accept=".csv" required>
            <br>
            <button type="submit" id="uploadButton">Upload</button>
        </form>
    </div>
    
    <div id="message"></div>

    <script>
        const uploadForm = document.getElementById('uploadForm');
        const uploadButton = document.getElementById('uploadButton');
        const messageDiv = document.getElementById('message');
        const fileInput = document.getElementById('fileInput');
        const uploadContainer = document.getElementById('uploadContainer');

        // Handle form submission
        uploadForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData();
            const file = fileInput.files[0];
            
            if (!file) {
                showMessage('Please select a file', 'error');
                return;
            }
            
            if (!file.name.toLowerCase().endsWith('.csv')) {
                showMessage('Please select a CSV file', 'error');
                return;
            }
            
            formData.append('file', file);
            
            // Show loading state
            uploadButton.disabled = true;
            uploadButton.textContent = 'Uploading...';
            showMessage('Uploading file...', 'loading');
            
            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage('File uploaded successfully! Redirecting...', 'success');
                    // Redirect to the next step
                    setTimeout(() => {
                        window.location.href = '/select_domain';
                    }, 1500);
                } else {
                    showMessage('Error: ' + data.error, 'error');
                    resetForm();
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showMessage('An error occurred during upload', 'error');
                resetForm();
            });
        });

        // Handle drag and drop
        uploadContainer.addEventListener('dragover', function(e) {
            e.preventDefault();
            uploadContainer.classList.add('dragover');
        });

        uploadContainer.addEventListener('dragleave', function(e) {
            e.preventDefault();
            uploadContainer.classList.remove('dragover');
        });

        uploadContainer.addEventListener('drop', function(e) {
            e.preventDefault();
            uploadContainer.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
            }
        });

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
        }

        function resetForm() {
            uploadButton.disabled = false;
            uploadButton.textContent = 'Upload';
        }
    </script>
</body>
</html>
