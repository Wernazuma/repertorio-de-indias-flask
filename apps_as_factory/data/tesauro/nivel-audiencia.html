  <h1>Nivel Audiencia</h1>
  <aside class="wiki-box">
  <p>En este nivel se reconstruyen los territorios competentes de las <a href="audiencia">audiencias</a> indianas.</p>
  <p>Se incluyen las fronteras circuncaribeñas, pero se excluyen las grandes fronteras del norte, sur y del interior continental.</p>
