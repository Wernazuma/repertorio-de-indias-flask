  <h1>Gentil</h1>
  <aside class="wiki-box center round box">
  <p>Término reservado en la base de datos para categorizar lugares dentro del ámbito colonial sin población cristiana ni presencia misional. Suelen ser "pueblos de indios amigos" o rancherías pacificadas dentro del ámbito de control español, pero ignoradas por las autoridades.</p>
  </aside>
