  <h1>Ermita</h1>
  <aside class="wiki-box center round box">
  <p>Institución religiosa con una iglesia o capilla en el despoblado, habitada - posiblemente - por un ermita.</p>
  <p>LEn el HGIS, no registramos ermitas de forma dedicada. Pero pueden figurar en la estructura eclesiástica o estructurando el espacio e incluirse en casos aislados.</p>
