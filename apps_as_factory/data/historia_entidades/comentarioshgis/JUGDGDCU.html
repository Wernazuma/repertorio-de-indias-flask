  <p>Dentro de Cuquio, existó Mezticacan como partido  con teniente, que también se distingue en documentos de la época de la intendencia (Lista de contribuciones a un donativo de 1795, AGI, Guadalajara,291) que incluía también el pueblo de indios de Acacico. También existió partido de Yahualica.</p>
