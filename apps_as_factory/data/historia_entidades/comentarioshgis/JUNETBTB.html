  <p>Hasta constituirse en gobierno propio, Tabasco dependió de Nueva España en los ramos de justicia, gobierno y hacienda, y de Yucatán en el de guerra. Se independizó completamente solo un par de años antes de tener que sujetarse al intendente de Yucatán en el ramo de hacienda a partir de 1787.</p>
