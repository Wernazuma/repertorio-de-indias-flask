  <p>San Benito fue erigido en curato en 1740 y uego formó parte de una alcaldía mayor común con Badiraguato/Santiago de los Caballeros, aunque luego volvió a la jurisdicción de Sinaloa en un momento desconocido pero anterior a 1787  <sup class="footnote-ref"><a href="#fn-1" id="fnref-1" aria-label="Footnote 1">1</a></sup>.</p>
