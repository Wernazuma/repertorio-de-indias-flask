  <p>Quivira en los siglos XVI y XVII era el  nombre para un reino mítico en los llanos grandes de la América septentrional central. En el siglo XVIII ya no se usó tanto el término pero aun así lo empleamos para acentuar lo utópico de la pertenencia de las vastas zonas desconocidas al Imperio español.</p>
