  <p>La intendencia de Arizpe fue la primera intendencia creada en Indias, como ensayo. Para un par de años, entre 1770 y 1776, existía el cargo de un intendente de Arizpe separado del cargo de gobernador, hasta que el intendente, Pedro Corbalán, reunió ambos cargos en su persona.</p>
