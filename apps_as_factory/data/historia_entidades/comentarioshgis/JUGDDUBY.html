  <p>Babonoyaba fue tenencia del corregimiento de Chihuahua, y  en 1793 fue erigido en subdelegación. Algunas veces se menciona un "subdelegado de Satevo" <sup class="footnote-ref"><a href="#fn-1" id="fnref-1" aria-label="Footnote 1">1</a></sup>, pero se trata solo de un alias y no de una subdelegación paralela.</p>
