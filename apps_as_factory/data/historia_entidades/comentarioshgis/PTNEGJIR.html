  <p>El partido de Irapuato aparece en  documentos tardíos <sup class="footnote-ref"><a href="#fn-1" id="fnref-1" aria-label="Footnote 1">1</a></sup>, pero no fue subdelegación propia. Por lo menos en 1792 existían alcaldes ordinarios en Irapuato y tenía autonomía interna con respecto a Guanajuato ((<a href="../fuentes/Mexico,1675">Mexico,1675</a>,f.317 (cuenta nueva).</p>
