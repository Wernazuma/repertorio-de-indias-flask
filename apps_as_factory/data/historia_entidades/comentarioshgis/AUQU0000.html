  <p>La Audiencia de Quito se suprimió por un corto período a partir de 1718, pasando su distrito a la Audiencia de Santa Fe.  En 1722 fue restablecida <sup class="footnote-ref"><a href="#fn-1" id="fnref-1" aria-label="Footnote 1">1</a></sup>. La Audiencia de Quito tradicionalmente tenía menos independencia de los virreyes del Perú que Chile o Tierra Firme.</p>
