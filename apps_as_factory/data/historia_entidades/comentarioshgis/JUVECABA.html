  <p>En la jurisdicción de Barquisimeto en 1768 hubo por lo menos dos corregidores: Uno del "partido de Yaritagua", quien además administró los pueblos de Yaritagua, Sarare y Santa Rosa, y además Aricagua  de la jurisdicción de Aragua, así como otro corregidor para Guara, Chibachoa y Urachiche.</p>
