  <p>En el siglo XVII (hasta 1697) así como en 1719 hubo nombramientos reales para la Alcaldía Mayor (de Minas) de Lajas. Aun así, nunca se estableció un dominio territorial claro y diferenciado del de la ciudad de Mariquita en cuyo distrito se hallaban las minas.</p>
