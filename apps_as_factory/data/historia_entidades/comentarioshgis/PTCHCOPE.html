  <p>Perquilauquen, aunque formó parte del corregimiento de Chillán hasta 1795, suele mencionarse como partido aparte y contenía el curato de su nombre y algunas dependencias del curato de Ninhue. Pierde esta distinción cuando se integra en el nuevamente formado partido de Linares en 1795.</p>
