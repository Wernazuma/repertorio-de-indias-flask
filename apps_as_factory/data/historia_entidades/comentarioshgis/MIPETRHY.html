  <p>Las conversiones de los hibitos y cholones en el rio Huallaga se iniciaron en 1676 por uno padres franciscanos de Lima. Todavía en el siglo XVII se entregaron al hospicio de Huaylillas, en  Pataz, por lo que se consideran parte del obispado de Trujillo.</p>
