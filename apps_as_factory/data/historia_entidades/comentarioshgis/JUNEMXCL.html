  <p>El partido de Atenango según Gerhard <sup class="footnote-ref"><a href="#fn-1" id="fnref-1" aria-label="Footnote 1">1</a></sup> ya fue transferido de Iscateupan a Chilapa tan temprano como 1560, pero los documentos accesibles via la guía general del AGN de México dan evidencia que esto sólo pasó en algún momento entre 1613 y 1640.</p>
