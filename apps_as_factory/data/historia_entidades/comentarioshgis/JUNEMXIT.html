  <p>Ixcateopan fue agregado permanente de Minas de Zaqualpa. Para 1743, Ixcateopan  todavía se consideraba jurisdicción aparte, pero en algún momento antes de 1786 se abolió el título. El nombramiento de Antonio Pascual de Borja de 1773todavía lo tiene como partido agregado.</p>
