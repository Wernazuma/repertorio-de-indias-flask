  <p>La tenencia de Micay debe haberse separado de la de Iscuandé  entre 1770 <sup class="footnote-ref"><a href="#fn-1" id="fnref-1" aria-label="Footnote 1">1</a></sup> y 1793 <sup class="footnote-ref"><a href="#fn-2" id="fnref-2" aria-label="Footnote 2">2</a></sup>, probablemente después de 1784, porque no tiene padrón propio para esa fecha <sup class="footnote-ref"><a href="#fn-3" id="fnref-3" aria-label="Footnote 3">3</a></sup>.</p>
