  <p>La provincia de Pamplona fue segregada de Tunja solo en 1795. Según el plan original de Moreno y Escandón <sup class="footnote-ref"><a href="#fn-1" id="fnref-1" aria-label="Footnote 1">1</a></sup>, se le deberían agregar los lugares de Tequia y Molagavita, pero últimamente quedaron de la parte de Tunja.</p>
