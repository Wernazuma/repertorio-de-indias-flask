  <p>Piñon, en la jurisdicción de Santa Marta y la vicaría de Sitio Nuevo, a fines de la Colonia tenía jueces ordinarios (1789: AGI,Santa_Fe,561) y capitanes a guerra (en 1791: <sup class="footnote-ref"><a href="#fn-1" id="fnref-1" aria-label="Footnote 1">1</a></sup>. Otras veces, el cargo fue vacante <sup class="footnote-ref"><a href="#fn-2" id="fnref-2" aria-label="Footnote 2">2</a></sup> o inexistente.</p>
