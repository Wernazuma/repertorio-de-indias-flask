<article class="wiki-entry">
  <p>Según Juarrós <sup class="footnote-ref"><a href="#fn-1" id="fnref-1" aria-label="Footnote 1">1</a></sup>, Guazacapan aún fue una jurisdicción propia y separada de Escuintla a principios del siglo XVIII. Aún así, nombramientos y licencias de corregidores de Escuintla llevan en el título a ambos pueblos desde por lo más tarde 1692.</p>
