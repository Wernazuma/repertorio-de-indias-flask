  <p>Es una de las "provincias subalternadas" como se tituló a aquellas jurisdicciones de Nueva España que fueron subordinadas a la Audiencia de Guadalajara (AGI, Guadalajara,435). En 1795, existieron  partidos de Zapotilc, Tuxpan, Mazamitla y Tamazuladentro de la subdelegación (AGI,Guadalajara,291).</p>
