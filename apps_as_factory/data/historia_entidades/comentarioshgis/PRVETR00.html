  <p>Aunque la desmembración de Guayana ya fue ordenada en 1729, el nombramiento del nuevo gobernador de Trinidad de 1731 todavía le designa de "Trinidad y la Guayana". Efectivamente, el reordenamiento solo tuvo efecto en 1733 <sup class="footnote-ref"><a href="#fn-1" id="fnref-1" aria-label="Footnote 1">1</a></sup>.</p>
