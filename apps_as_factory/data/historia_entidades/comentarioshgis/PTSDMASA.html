  <p>Parte de la jurisdicción de Matanzas, Santa Ana tenía capitán pedáneo independiente a partir de la reforma de 1765. Su territorio seguramente incluyó Cidra, pero es menos claro si también le competió el partido de Sabanilla o si ese lugar permaneció como exclave bajo control directo de Matanzas.</p>
