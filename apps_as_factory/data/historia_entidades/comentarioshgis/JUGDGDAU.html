  <p>Es una de las "provincias subalternadas" como se tituló a aquellas jurisdicciones de Nueva España que fueron subordinadas a la Audiencia de Guadalajara (AGI, Guadalajara,435). En 1795, existieron por lo menos los partidos de Ameca y Tecolotlan-Ayuca dentro de la subdelegación (AGI,Guadalajara,291).</p>
