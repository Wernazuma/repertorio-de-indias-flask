  <p>Las guías de forasteros ignoran los subdelegados de Amozoc y Totomehuacan, que antiguamente fueron tenientes de gobernador de Puebla. Sin embargo, tanto un informe de 1793 <sup class="footnote-ref"><a href="#fn-1" id="fnref-1" aria-label="Footnote 1">1</a></sup> como el Mercurio histórico y político de Madrid de octubre 1794 lo mencionan.</p>
