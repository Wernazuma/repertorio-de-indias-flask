  <p>Guamal, en la jurisdicción de Tamalameque, aparece como Vicaría de la provincia de Santa Marta en los padrones de Santa Marta de 1777 y 1793 <sup class="footnote-ref"><a href="#fn-1" id="fnref-1" aria-label="Footnote 1">1</a></sup>, pero generalmente aparece como parte integrante de Tamalameque.</p>
