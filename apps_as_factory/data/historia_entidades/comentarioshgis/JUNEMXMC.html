<article class="wiki-entry">
  <p>Metepec solo se independizó de Ixtlahuaca en 1762 <sup class="footnote-ref"><a href="#fn-1" id="fnref-1" aria-label="Footnote 1">1</a></sup> . Aunque antes de la división también se habla de la "AM de Metepec" en vez de Ixtlahuaca, hemos optado por definir la continuación de la entidad en Ixtlahuaca, siendo Metepec la nuevamente erigida.</p>
