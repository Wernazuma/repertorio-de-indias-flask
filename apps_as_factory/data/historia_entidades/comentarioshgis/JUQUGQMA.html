  <p>La costa entre Machala y Naranjal también fue reclamada por la gobernación de Cuenca, pero efectivamente siempre fue administrada desde Guayaquil y se consideró parte del partido de Machala, separadas de Cuenca por "selvas incultas y hasta hoy poco conocidas" <sup class="footnote-ref"><a href="#fn-1" id="fnref-1" aria-label="Footnote 1">1</a></sup>.</p>
