  <p>San Rafael se fundó en 1761, pero solo en 1765/1666 se independizó de la jurisdicción de Hincha en el marco de conflicto que había entre el gobernador de armas/justicia mayor para Hincha y Bánica y el cabildo de Hincha. Eclesiásticamente permaneció ayuda de parroquia de Hincha.</p>
