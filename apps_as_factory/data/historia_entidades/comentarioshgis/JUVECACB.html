  <p>Calabozo fue una villa fundada en territorio de la ciudad de San Sebastián. Aunque tenía propia jurisdicción, en otras ocasiones la jurisdicción sigue subsumiéndose en la de San Sebastián <sup class="footnote-ref"><a href="#fn-1" id="fnref-1" aria-label="Footnote 1">1</a></sup>.</p>
