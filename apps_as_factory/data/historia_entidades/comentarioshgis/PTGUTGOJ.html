  <p>Ojojona fue partido de la alcaldía mayor de Tegucigalpa en 1743 y 1765. En el sistema de intendencias en un principio no se menciona como partido independiente, pero sí se menciona de forma esporádica, siendo un partido completamente sujeto al de Tegucigalpa.</p>
