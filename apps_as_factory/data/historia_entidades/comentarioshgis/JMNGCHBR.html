  <p>El pueblo de Los Brazosen ocasiones tenía su propio corregidor (p.e. en 1787 (AGI,Santa_Fe,561). En otras ocasiones, hubo un corregidor común para Novitá y Los Brazos, y en aún otros no hubo corregidor sino que ambos pueblos fueron el distrito cabecera del gobernador y su teniente en Novitá.</p>
