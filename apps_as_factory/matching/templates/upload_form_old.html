<!doctype html>
<html>
<head>
  <title>Toponym Matcher - Step 1</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h2>Enter file prefix</h2>
  <form method="POST">
    <input type="text" name="prefix" required>
    <input type="submit" value="Load">
  </form>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <ul class="flash-messages">
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}

  {% if prefix %}
  
    <p><a href="{{ url_for('.run_matching', prefix=prefix) }}">Run Matching</a></p>
	<p><a href="{{ url_for('.match_status', prefix=prefix) }}">Match status</a></p>
    <p><a href="{{ url_for('.disambiguate', prefix=prefix) }}">Start Disambiguation</a></p>
  {% endif %}
</body>
</html>
