name: Update Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push app image
        uses: docker/build-push-action@v7
        with:
          context: '{{defaultContext}}:apps_as_factory'
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/hgis-indias-app:latest
          push: true
          provenance: true
          sbom: true

      - name: Build and push proxy image
        uses: docker/build-push-action@v7
        with:
          context: '{{defaultContext}}:nginx_proxy'
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/hgis-indias-nginx:latest
          push: true
          provenance: true
          sbom: true
